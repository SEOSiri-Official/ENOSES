<!DOCTYPE html><html><head><title>SEOSIRI AGRI-ARCHITECT v82.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
:root { --cyan: #00e5ff; --green: #00ff00; --bg: #030303; }
body { background: var(--bg); color: var(--cyan); font-family: monospace; padding: 20px; margin:0; }
.header { border-bottom: 2px solid var(--cyan); padding: 10px; margin-bottom: 20px; display:flex; justify-content:space-between; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
.box { border: 1px solid var(--cyan); padding: 20px; text-align: center; background: rgba(0,229,255,0.05); }
.val { font-size: 2em; font-weight: bold; color: #fff; display: block; }
.terminal { background: #000; border: 1px solid var(--green); padding: 15px; color: var(--green); height: 250px; overflow-y: auto; font-size: 1.1em; }
#v-img { width: 100%; border: 2px solid #ffcc00; border-radius: 5px; }
</style></head><body>
<div class="header">
    <div><h1 style="margin:0;">SEOSIRI: AGRI-ARCHITECT CORE</h1><small>FOUNDER: MOMENUL AHMAD | SEOSIRI.COM</small></div>
    <div style="text-align:right;"><p>FARM UPLINK: <span style="color:#0f0;">ACTIVE</span></p></div>
</div>
<div class="grid">
    <div class="box">SOIL MOISTURE<span id="moist" class="val">0.00%</span></div>
    <div class="box">SOIL DENSITY<span id="dens" class="val">0.000ρ</span></div>
    <div class="box">DAYLIGHT<span id="light" class="val">0.00%</span></div>
    <div class="box">FUNGUS INDEX<span id="fungus" class="val">0.000</span></div>
    <div class="box">ACOUSTIC INTENSITY<span id="vol" class="val">0.00dB</span></div>
</div>
<div style="display:grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px;">
    <div class="box" style="text-align:left;"><h3>PRECISION FARMING REPORT</h3><div id="report" class="terminal">> SCANNING CROP FIELD...</div><h2 id="cmd" style="color:#f0f; margin-top:10px;">ROBOTICS: IDLE</h2></div>
    <div class="box"><h3>FIELD CROP SIGHT</h3><img id="v-img" src=""></div>
</div>
<script>
const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "seosiri_agri_" + Math.random());
client.onMessageArrived = (msg) => {
    const data = JSON.parse(msg.payloadString);
    if(msg.destinationName.includes("telemetry")) {
        if(data.metrics) {
            document.getElementById('vol').innerText = data.metrics.vol + "dB";
            document.getElementById('dens').innerText = data.metrics.dens + "ρ";
            document.getElementById('moist').innerText = data.metrics.moist + "%";
            document.getElementById('light').innerText = data.metrics.light + "%";
        }
        if(data.analysis && data.metadata) {
            const term = document.getElementById('report');
            term.innerHTML += '<br>> [' + data.metadata.ts + '] ' + data.analysis.sector + ': ' + data.analysis.desc;
            term.scrollTop = term.scrollHeight;
            document.getElementById('cmd').innerText = "ROBOTICS: " + data.analysis.cmd;
        }
    } else {
        document.getElementById('v-img').src = "data:image/jpeg;base64," + data.img;
        document.getElementById('fungus').innerText = data.fungus_idx;
    }
};
client.connect({useSSL: true, onSuccess: () => { 
    client.subscribe("seosiri/enoses/agri/telemetry"); client.subscribe("seosiri/enoses/agri/vision"); 
}});
</script></body></html>
