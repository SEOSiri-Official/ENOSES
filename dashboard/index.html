<!DOCTYPE html><html><head><title>SEOSIRI AGRI v63.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
body { background: #030303; color: #00e5ff; font-family: monospace; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.box { border: 1px solid #00e5ff; padding: 15px; text-align: center; background: rgba(0,229,255,0.05); }
.val { font-size: 2em; font-weight: bold; color: #fff; display: block; }
.terminal { background: #000; border: 1px solid #0f0; padding: 15px; color: #0f0; height: 250px; overflow-y: auto; }
</style></head><body>
<h1>SEOSIRI: AGRI-ARCHITECT CORE v63.0</h1>
<div class="grid">
<div class="box">INTENSITY<br><span id="vol" class="val">0.00dB</span></div>
<div class="box">DENSITY<br><span id="dens" class="val">0.00ρ</span></div>
<div class="box">MOISTURE<br><span id="moist" class="val">0.00%</span></div>
<div class="box">OZONE<br><span id="o3" class="val">0.000</span></div></div>
<div style="display:grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px;">
<div class="box" style="text-align:left;"><h3>REPORT</h3><div id="report" class="terminal">> SCANNING...</div></div>
<div class="box"><h3>SIGHT</h3><img id="v-img" src="" style="width:100%;"></div></div>
<script>
const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "ui_" + Math.random());
client.onMessageArrived = (msg) => {
    const d = JSON.parse(msg.payloadString);
    if(msg.destinationName.includes("telemetry")) {
        if(d.metrics) {
            document.getElementById('vol').innerText = d.metrics.intensity + "dB";
            document.getElementById('dens').innerText = d.metrics.density + "ρ";
            document.getElementById('moist').innerText = d.metrics.moisture + "%";
            document.getElementById('o3').innerText = d.metrics.ozone;
        }
        if(d.analysis) {
            const t = document.getElementById('report');
            t.innerHTML += '<br>> [' + (d.metadata ? d.metadata.ts : 'SYNC') + '] ' + d.analysis.sector + ': ' + d.analysis.desc;
            t.scrollTop = t.scrollHeight;
        }
    } else { document.getElementById('v-img').src = "data:image/jpeg;base64," + d.image_data; }
};
client.connect({useSSL: true, onSuccess: () => { 
    client.subscribe("seosiri/enoses/telemetry"); client.subscribe("seosiri/enoses/vision"); 
}});
</script></body></html>
