<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEOSIRI: AGRI-ARCHITECT v62.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --cyan: #00e5ff; --pink: #ff007f; --bg: #030303; }
        body { background: var(--bg); color: var(--cyan); font-family: 'Segoe UI', monospace; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--cyan); padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .box { border: 1px solid var(--cyan); padding: 15px; background: rgba(0, 229, 255, 0.05); text-align: center; }
        .val { font-size: 2em; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--cyan); }
        .terminal { background: #000; border: 1px solid #00ff00; padding: 15px; color: #00ff00; height: 180px; overflow-y: auto; font-size: 1.1em; }
        #vision { width: 100%; border: 1px solid var(--pink); height: 250px; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>SEOSIRI: AGRI-ARCHITECT CORE</h1><small>FOUNDER: MOMENUL AHMAD | SEOSIRI.COM</small></div>
        <div style="text-align:right;"><p>UPLINK: <span style="color:#0f0;">ACTIVE</span></p></div>
    </div>
    <div class="grid">
        <div class="box">INTENSITY<br><span id="vol" class="val">0.00dB</span></div>
        <div class="box">SOIL DENSITY<br><span id="dens" class="val">0.00ρ</span></div>
        <div class="box">MOISTURE<br><span id="moist" class="val">0.00%</span></div>
        <div class="box">OZONE<br><span id="o3" class="val">0.000</span></div>
    </div>
    <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px;">
        <div class="box" style="text-align:left;">
            <h3>SENSORY INTELLIGENCE REPORT</h3>
            <div id="report" class="terminal">> AWAITING FIELD SENSOR...</div>
        </div>
        <div class="box">
            <h3>FIELD SIGHT (VISION_RX)</h3>
            <div id="vision"><img id="v-img" src="" style="max-width:100%;"></div>
        </div>
    </div>
    <script>
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "seosiri_agri_" + Math.random());
        client.onMessageArrived = (msg) => {
            const data = JSON.parse(msg.payloadString);
            if(msg.destinationName.includes("telemetry")) {
                if(data.metrics) {
                    document.getElementById('vol').innerText = data.metrics.intensity + "dB";
                    document.getElementById('dens').innerText = data.metrics.density + "ρ";
                    document.getElementById('moist').innerText = data.metrics.moisture + "%";
                    document.getElementById('o3').innerText = data.metrics.ozone;
                }
                if(data.analysis && data.analysis.desc) {
                    const term = document.getElementById('report');
                    term.innerHTML += `<br>> [${data.metadata.timestamp}] ${data.analysis.sector}: ${data.analysis.desc}`;
                    term.scrollTop = term.scrollHeight;
                }
            } else {
                document.getElementById('v-img').src = "data:image/jpeg;base64," + data.image_data;
            }
        };
        client.connect({useSSL: true, onSuccess: () => {
            client.subscribe("seosiri/enoses/telemetry");
            client.subscribe("seosiri/enoses/vision");
        }});
    </script>
</body>
</html>
