<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEOSIRI: ENOSES ULTIMA v60.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --cyan: #00e5ff; --pink: #ff007f; --bg: #030303; }
        body { background: var(--bg); color: var(--cyan); font-family: 'Segoe UI', monospace; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--cyan); padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .box { border: 1px solid var(--cyan); padding: 15px; background: rgba(0, 229, 255, 0.05); text-align: center; }
        .val { font-size: 2.2em; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--cyan); }
        .terminal { background: #000; border: 1px solid #00ff00; padding: 15px; color: #00ff00; height: 180px; overflow-y: auto; }
        .search-bar { background: #111; border: 1px solid var(--cyan); color: #fff; padding: 10px; width: 100%; margin-bottom: 10px; }
        #sos-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff0000; color: #fff; display: none; align-items: center; justify-content: center; z-index: 100000; flex-direction: column; }
    </style>
</head>
<body role="main">
    <div id="sos-overlay"><h1 style="font-size: 8em;">SOS ACTIVE</h1><h2 id="timer" style="font-size: 5em;">10</h2></div>

    <div class="header">
        <div><h1>SEOSIRI: ENOSES CORE</h1><small>FOUNDER: MOMENUL AHMAD</small></div>
        <div style="width: 300px;"><input type="text" id="search" class="search-bar" placeholder="SEARCH SECTOR..."></div>
    </div>

    <div class="grid">
        <div class="box" aria-label="Intensity Readout">INTENSITY<br><span id="vol" class="val">0.00dB</span></div>
        <div class="box" aria-label="Frequency Readout">FREQUENCY<br><span id="freq" class="val">0Hz</span></div>
        <div class="box" aria-label="Soil Density Readout">DENSITY<br><span id="dens" class="val">0.00ρ</span></div>
        <div class="box" aria-label="Weight Readout">WEIGHT<br><span id="mass" class="val">0.0kg</span></div>
    </div>

    <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px;">
        <div class="box" style="text-align:left;">
            <h3>INTELLIGENCE REPORT</h3>
            <div id="report" class="terminal" role="log">> SCANNING...</div>
        </div>
        <div class="box">
            <h3>FIELD SIGHT</h3>
            <img id="vision" src="" style="width:100%; border: 1px solid var(--pink);">
        </div>
    </div>

    <script>
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "seosiri_ui_" + Math.random());
        let sosRunning = false;

        client.onMessageArrived = (msg) => {
            const data = JSON.parse(msg.payloadString);
            const query = document.getElementById('search').value.toUpperCase();
            
            if(msg.destinationName.includes("telemetry")) {
                if(data.metrics) {
                    document.getElementById('vol').innerText = data.metrics.vol + "dB";
                    document.getElementById('freq').innerText = data.metrics.freq + "Hz";
                    document.getElementById('dens').innerText = data.metrics.dens + "ρ";
                    document.getElementById('mass').innerText = data.metrics.mass + "kg";
                }
                if(data.analysis && (query === "" || data.analysis.sector.includes(query))) {
                    const term = document.getElementById('report');
                    term.innerHTML += `<br>[${data.metadata.ts}] ${data.analysis.sector}: ${data.analysis.desc}`;
                    term.scrollTop = term.scrollHeight;
                    if(data.analysis.risk === "MAXIMUM" && !sosRunning) triggerSOS();
                }
            } else {
                document.getElementById('vision').src = "data:image/jpeg;base64," + data.image_data;
            }
        };

        function triggerSOS() {
            sosRunning = true;
            document.getElementById('sos-overlay').style.display = 'flex';
            let c = 10;
            const t = setInterval(() => {
                c--; document.getElementById('timer').innerText = c;
                if(c === 0) { clearInterval(t); document.getElementById('sos-overlay').style.display = 'none'; sosRunning = false; }
            }, 1000);
        }

        client.connect({useSSL: true, onSuccess: () => {
            client.subscribe("seosiri/enoses/telemetry");
            client.subscribe("seosiri/enoses/vision");
        }});
    </script>
</body>
</html>
