# =================================================================
# ENOSES INNOVATION CONFIG (D-DRIVE MASTER v4 - STUNNING MASTER)
# =================================================================

# 1. Standard MQTT Port (For your HP Pro x2 Python Nose)
listener 1883 0.0.0.0
protocol mqtt
set_tcp_nodelay true

# 2. INNOVATION: Websocket Port (For Google AI Studio Voxel World)
# We use 0.0.0.0 to ensure the browser can see the laptop's IP
listener 9001 0.0.0.0
protocol websockets
websockets_log_level 1023

# 3. Security (Open for Innovation Development)
allow_anonymous true

# 4. Persistence (D-Drive Deep Storage for Scent Data)
persistence true
persistence_location D:/ENOSES_Project/mosquitto/Mosquitto/

# 5. Logging (The Project's Heartbeat)
log_dest stdout
log_dest file D:/ENOSES_Project/mosquitto/Mosquitto/mosquitto.log
log_type all

# 6. STABILITY FIX
# Prevents the "Socket Error 7" by managing IPv4 handshakes correctly
socket_domain ipv4
max_queued_messages 2000